[project]
name = "custodex"
version = "0.0.1"
description = "Custodex - Local-first visual workbench and RAG dataset preparation editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "openai>=1.14.0",
    "faiss-cpu>=1.8.0",
    "langchain-text-splitters>=0.0.1",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"